[package]
name = "base-message"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
description = "Interpret the header and trailer field sections of protocol messages into typed structs"
repository = "https://github.com/base-rs/base-message"
readme = "readme.md"
keywords = ["headers", "fields", "http", "mime", "message"]
categories = ["web-programming", "parser-implementations", "email"]
include = ["src/**", "context/**", "Cargo.toml", "readme.md", "license.md", "releases.md"]

[workspace]
members = ["macros", "bake", "benchmarks/interpretation"]
resolver = "3"

[workspace.metadata.bake.release]
reviewers = ["base-rs/maintainers"]

[dependencies]
base-message-macros = { version = "=0.1.0", path = "macros" }

[dev-dependencies]
base-web-media-type = "0.1"
trybuild = "1"
